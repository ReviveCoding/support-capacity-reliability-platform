[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-capacity-reliability"
version = "1.4.1rc2"
description = "Reliability-aware contact forecasting, queueing digital twin, and workforce optimization platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jinwoo Bae"}]
dependencies = [
  "numpy>=1.26,<2.4",
  "pandas>=2.1,<2.3",
  "scipy>=1.11,<1.18",
  "scikit-learn>=1.4,<1.9",
  "lightgbm>=4.0,<5",
  "simpy>=4.1,<5",
  "ortools>=9.10,<9.16",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "joblib>=1.3,<2",
  "tabulate>=0.9,<0.10",
  "fastapi>=0.110,<0.139",
  "uvicorn>=0.27,<0.49",
]

[project.optional-dependencies]
torch = ["torch>=2.2,<2.11"]
chronos = ["chronos-forecasting>=2.1.0,<3"]
full = ["torch>=2.2,<2.11", "chronos-forecasting>=2.1.0,<3"]
streamlit = ["streamlit>=1.33", "plotly>=5.20"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "httpx>=0.27", "build>=1.2"]

[project.scripts]
support-capacity = "support_capacity_reliability.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.package-data]
support_capacity_reliability = ["default_configs/*.yaml"]
