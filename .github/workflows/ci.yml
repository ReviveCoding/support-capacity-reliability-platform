name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "42"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  quality:
    name: quality-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Record runner environment
        run: python scripts/write_environment_evidence.py --output reports/github_runner_environment.json
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip check
      - name: Run portable core qualification
        run: python scripts/qualify_local.py --profile CORE --skip-install --output reports/ci_core_qualification.json
      - name: Upload quality evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python-version }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/github_runner_environment.json
            reports/ci_core_qualification.json
            reports/qualification_logs
            reports/coverage.xml
            dist/*.whl
            dist/*.tar.gz

  torch-quality:
    name: torch-quality-ubuntu-py3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .[dev]
          python -m pip check
      - name: Exercise optional torch forecaster
        run: |
          python -m pytest tests/unit/test_torch_model.py -q
          python -m support_capacity_reliability.cli validate-config --config configs/smoke_torch.yaml
      - name: Upload torch evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: torch-quality-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: reports/qualification_logs

  smoke:
    name: smoke-ubuntu-py3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
      - name: Record runner environment
        run: python scripts/write_environment_evidence.py --output reports/github_runner_environment.json
      - name: Validate and execute release smoke
        run: |
          python -m support_capacity_reliability.cli doctor --config configs/smoke.yaml
          python -m support_capacity_reliability.cli validate-config --config configs/smoke.yaml
          python -m support_capacity_reliability.cli run --config configs/smoke.yaml --require-release
          python -m support_capacity_reliability.cli verify-output --output outputs/smoke
          python -m support_capacity_reliability.cli verify-model-bundle --artifact-dir outputs/smoke/artifacts
          python -m build
          python scripts/verify_distribution.py
          python scripts/smoke_installed_wheel.py --run-pipeline --run-api-pipeline
      - name: Upload smoke evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: smoke-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/github_runner_environment.json
            outputs/smoke/reports
            outputs/smoke/metrics
            outputs/smoke/artifacts
            outputs/smoke/artifact_index.json
            outputs/smoke/run_summary.json
            outputs/smoke/run_manifest.json
            outputs/smoke/stage.log
            outputs/smoke/stage_timing.jsonl
            dist/*.whl
            dist/*.tar.gz

  insufficient-workforce-gate:
    name: insufficient-workforce-ubuntu-py3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
      - name: Validate and execute negative release gate
        run: |
          python -m support_capacity_reliability.cli doctor --config configs/stress_insufficient_workforce.yaml
          python -m support_capacity_reliability.cli validate-config --config configs/stress_insufficient_workforce.yaml
          python -m support_capacity_reliability.cli run --config configs/stress_insufficient_workforce.yaml --expected-status ITERATE
          python -m support_capacity_reliability.cli verify-output --output outputs/stress_insufficient_workforce
          python -m support_capacity_reliability.cli verify-model-bundle --artifact-dir outputs/stress_insufficient_workforce/artifacts
      - name: Upload insufficient-workforce evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: insufficient-workforce-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            outputs/stress_insufficient_workforce/reports
            outputs/stress_insufficient_workforce/metrics
            outputs/stress_insufficient_workforce/artifacts
            outputs/stress_insufficient_workforce/artifact_index.json
            outputs/stress_insufficient_workforce/run_summary.json
            outputs/stress_insufficient_workforce/run_manifest.json
            outputs/stress_insufficient_workforce/stage.log
            outputs/stress_insufficient_workforce/stage_timing.jsonl
