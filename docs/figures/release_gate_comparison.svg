<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Release-gate comparison between canonical and stress evidence</title>
  <desc id="desc">Canonical PASS_WITH_RECOURSE compared with insufficient-workforce ITERATE negative gate.</desc>
  <style>
    .title { font: 700 25px Arial, Helvetica, sans-serif; fill: #14213d; }
    .subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #5b677a; }
    .small { font: 12px Arial, Helvetica, sans-serif; fill: #5b677a; }
    .label { font: 600 13px Arial, Helvetica, sans-serif; fill: #14213d; }
    .value { font: 700 17px Arial, Helvetica, sans-serif; fill: #14213d; }
    .box-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #14213d; }
    .box-sub { font: 12px Arial, Helvetica, sans-serif; fill: #5b677a; }
    .axis { font: 11px Arial, Helvetica, sans-serif; fill: #5b677a; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60.00" y="52.00" class="title" text-anchor="start">Release gate distinguishes recoverable demand from structural shortfall</text><text x="60.00" y="77.00" class="subtitle" text-anchor="start">The negative case is intended to remain ITERATE: the gate rejects infeasible workforce conditions instead of silently relaxing constraints.</text><rect x="75.00" y="135.00" width="485.00" height="300.00" rx="16" fill="#f7f9fc" stroke="#1b7f5d"/><rect x="75.00" y="135.00" width="485.00" height="15.00" rx="16" fill="#1b7f5d" stroke="none"/><text x="100.00" y="193.00" class="box-title" text-anchor="start">Canonical smoke</text><text x="100.00" y="219.00" class="subtitle" text-anchor="start">42 agents</text><rect x="100.00" y="242.00" width="435.00" height="43.00" rx="8" fill="#1b7f5d" stroke="none" opacity="0.16"/><text x="317.50" y="269.00" class="value" text-anchor="middle">PASS_WITH_RECOURSE</text><text x="100.00" y="325.00" class="small" text-anchor="start">Schedule feasibility</text><text x="535.00" y="325.00" class="label" text-anchor="end">100%</text><line x1="100.00" y1="337.00" x2="535.00" y2="337.00" stroke="#e2e8f0" stroke-width="1"/><text x="100.00" y="362.00" class="small" text-anchor="start">Hard violations</text><text x="535.00" y="362.00" class="label" text-anchor="end">0</text><line x1="100.00" y1="374.00" x2="535.00" y2="374.00" stroke="#e2e8f0" stroke-width="1"/><text x="100.00" y="399.00" class="small" text-anchor="start">Release boundary</text><text x="535.00" y="399.00" class="label" text-anchor="end">bounded recourse</text><text x="100.00" y="408.00" class="small" text-anchor="start">Canonical replay recovered inside gate limits.</text><rect x="640.00" y="135.00" width="485.00" height="300.00" rx="16" fill="#f7f9fc" stroke="#bd3d4d"/><rect x="640.00" y="135.00" width="485.00" height="15.00" rx="16" fill="#bd3d4d" stroke="none"/><text x="665.00" y="193.00" class="box-title" text-anchor="start">Insufficient-workforce stress</text><text x="665.00" y="219.00" class="subtitle" text-anchor="start">36 agents</text><rect x="665.00" y="242.00" width="435.00" height="43.00" rx="8" fill="#bd3d4d" stroke="none" opacity="0.16"/><text x="882.50" y="269.00" class="value" text-anchor="middle">ITERATE</text><text x="665.00" y="325.00" class="small" text-anchor="start">Schedule feasibility</text><text x="1100.00" y="325.00" class="label" text-anchor="end">98%</text><line x1="665.00" y1="337.00" x2="1100.00" y2="337.00" stroke="#e2e8f0" stroke-width="1"/><text x="665.00" y="362.00" class="small" text-anchor="start">Hard violations</text><text x="1100.00" y="362.00" class="label" text-anchor="end">1</text><line x1="665.00" y1="374.00" x2="1100.00" y2="374.00" stroke="#e2e8f0" stroke-width="1"/><text x="665.00" y="399.00" class="small" text-anchor="start">Release boundary</text><text x="1100.00" y="399.00" class="label" text-anchor="end">fail closed</text><text x="665.00" y="408.00" class="small" text-anchor="start">Structural shortfall retained after bounded recourse.</text><line x1="567.00" y1="262.00" x2="625.00" y2="262.00" stroke="#5b677a" stroke-width="2.3" stroke-dasharray="7 5"/><text x="596.00" y="244.00" class="small" text-anchor="middle">capacity stress</text><text x="60.00" y="486.00" class="small" text-anchor="start">The stress configuration is a negative-control test, not a failed release candidate. It verifies that the release gate remains fail-closed.</text>
</svg>
