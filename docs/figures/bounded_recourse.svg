<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Bounded intraday recourse closes operational gaps</title>
  <desc id="desc">Recourse actions and release-gate outcomes from smoke evidence.</desc>
  <style>
    .title { font: 700 25px Arial, Helvetica, sans-serif; fill: #14213d; }
    .subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #5b677a; }
    .small { font: 12px Arial, Helvetica, sans-serif; fill: #5b677a; }
    .label { font: 600 13px Arial, Helvetica, sans-serif; fill: #14213d; }
    .value { font: 700 17px Arial, Helvetica, sans-serif; fill: #14213d; }
    .box-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #14213d; }
    .box-sub { font: 12px Arial, Helvetica, sans-serif; fill: #5b677a; }
    .axis { font: 11px Arial, Helvetica, sans-serif; fill: #5b677a; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60.00" y="52.00" class="title" text-anchor="start">Bounded intraday recourse closes operational gaps</text><text x="60.00" y="77.00" class="subtitle" text-anchor="start">The release outcome is not a raw forecast score: recovery must remain inside feasibility, hard-violation, action-rate, and cost-share gates.</text><rect x="82.00" y="152.00" width="640.00" height="250.00" rx="10" fill="#f7f9fc" stroke="#d7dee8"/><rect x="112.00" y="185.00" width="120.00" height="175.00" rx="6" fill="#1b7f5d" stroke="none"/><text x="172.00" y="176.00" class="value" text-anchor="middle">3</text><text x="172.00" y="380.00" class="axis" text-anchor="middle"><tspan x="172.00" dy="0.00">offer</tspan><tspan x="172.00" dy="13.00">overtime</tspan></text><text x="172.00" y="430.00" class="axis" text-anchor="middle">cost +916</text><rect x="262.00" y="301.67" width="120.00" height="58.33" rx="6" fill="#1f77b4" stroke="none"/><text x="322.00" y="292.67" class="value" text-anchor="middle">1</text><text x="322.00" y="380.00" class="axis" text-anchor="middle"><tspan x="322.00" dy="0.00">cross</tspan><tspan x="322.00" dy="13.00">skill</tspan><tspan x="322.00" dy="13.00">reassignment</tspan></text><text x="322.00" y="430.00" class="axis" text-anchor="middle">cost +0</text><rect x="770.00" y="145.00" width="365.00" height="300.00" rx="12" fill="#f7f9fc" stroke="#d7dee8"/><text x="792.00" y="183.00" class="box-title" text-anchor="start">Release-gated outcome</text><text x="792.00" y="227.00" class="small" text-anchor="start">Release decision</text><text x="1113.00" y="227.00" class="value" text-anchor="end">PASS_WITH_RECOURSE</text><line x1="792.00" y1="238.00" x2="1113.00" y2="238.00" stroke="#e2e8f0" stroke-width="1"/><text x="792.00" y="261.00" class="small" text-anchor="start">Schedule feasibility</text><text x="1113.00" y="261.00" class="label" text-anchor="end">100%</text><line x1="792.00" y1="272.00" x2="1113.00" y2="272.00" stroke="#e2e8f0" stroke-width="1"/><text x="792.00" y="295.00" class="small" text-anchor="start">Hard violations</text><text x="1113.00" y="295.00" class="label" text-anchor="end">0</text><line x1="792.00" y1="306.00" x2="1113.00" y2="306.00" stroke="#e2e8f0" stroke-width="1"/><text x="792.00" y="329.00" class="small" text-anchor="start">Recourse action rate</text><text x="1113.00" y="329.00" class="label" text-anchor="end">9.5%</text><line x1="792.00" y1="340.00" x2="1113.00" y2="340.00" stroke="#e2e8f0" stroke-width="1"/><text x="792.00" y="363.00" class="small" text-anchor="start">Recourse cost share</text><text x="1113.00" y="363.00" class="label" text-anchor="end">9.7%</text><line x1="792.00" y1="374.00" x2="1113.00" y2="374.00" stroke="#e2e8f0" stroke-width="1"/><text x="792.00" y="397.00" class="small" text-anchor="start">Actions applied</text><text x="1113.00" y="397.00" class="label" text-anchor="end">4</text><text x="82.00" y="484.00" class="small" text-anchor="start">Action bars exclude hold_schedule rows. Costs are estimated operational-cost deltas in the persisted recourse artifact.</text>
</svg>
