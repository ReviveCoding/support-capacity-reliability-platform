  <text x="60.00" y="54.00" class="title" text-anchor="start">Reliability-aware workforce decision pipeline</text><text x="60.00" y="79.00" class="subtitle" text-anchor="start">Forecast candidates are not promoted on accuracy alone: each path is evaluated through feasibility, queue performance, bounded recourse, and a fail-closed release gate.</text><rect x="45.00" y="160.00" width="172.00" height="150.00" rx="14" fill="#f7f9fc" stroke="#72b7d2"/><rect x="45.00" y="160.00" width="172.00" height="11.00" rx="14" fill="#72b7d2" stroke="none"/><text x="131.00" y="213.00" class="box-title" text-anchor="middle">Data contracts</text><text x="131.00" y="246.00" class="box-sub" text-anchor="middle">Synthetic ACD / public proxies</text><line x1="221.00" y1="235.00" x2="235.00" y2="235.00" stroke="#5b677a" stroke-width="2.2"/><polygon points="235.00,235.00 226.00,230.00 226.00,240.00" fill="#5b677a"/><rect x="239.00" y="160.00" width="172.00" height="150.00" rx="14" fill="#f7f9fc" stroke="#1f77b4"/><rect x="239.00" y="160.00" width="172.00" height="11.00" rx="14" fill="#1f77b4" stroke="none"/><text x="325.00" y="213.00" class="box-title" text-anchor="middle">Forecast ladder</text><text x="325.00" y="246.00" class="box-sub" text-anchor="middle"><tspan x="325.00" dy="0.00">Seasonal</tspan><tspan x="325.00" dy="16.00">Poisson</tspan><tspan x="325.00" dy="16.00">LightGBM</tspan><tspan x="325.00" dy="16.00">Torch</tspan></text><line x1="415.00" y1="235.00" x2="429.00" y2="235.00" stroke="#5b677a" stroke-width="2.2"/><polygon points="429.00,235.00 420.00,230.00 420.00,240.00" fill="#5b677a"/><rect x="433.00" y="160.00" width="172.00" height="150.00" rx="14" fill="#f7f9fc" stroke="#6f4aa8"/><rect x="433.00" y="160.00" width="172.00" height="11.00" rx="14" fill="#6f4aa8" stroke="none"/><text x="519.00" y="213.00" class="box-title" text-anchor="middle">Reliability</text><text x="519.00" y="246.00" class="box-sub" text-anchor="middle"><tspan x="519.00" dy="0.00">RCWE</tspan><tspan x="519.00" dy="16.00">calibration</tspan><tspan x="519.00" dy="16.00">coherent scenarios</tspan></text><line x1="609.00" y1="235.00" x2="623.00" y2="235.00" stroke="#5b677a" stroke-width="2.2"/><polygon points="623.00,235.00 614.00,230.00 614.00,240.00" fill="#5b677a"/><rect x="627.00" y="160.00" width="172.00" height="150.00" rx="14" fill="#f7f9fc" stroke="#b87800"/><rect x="627.00" y="160.00" width="172.00" height="11.00" rx="14" fill="#b87800" stroke="none"/><text x="713.00" y="213.00" class="box-title" text-anchor="middle">Decision</text><text x="713.00" y="246.00" class="box-sub" text-anchor="middle"><tspan x="713.00" dy="0.00">HiGHS capacity</tspan><tspan x="713.00" dy="16.00">CP-SAT schedule</tspan></text><line x1="803.00" y1="235.00" x2="817.00" y2="235.00" stroke="#5b677a" stroke-width="2.2"/><polygon points="817.00,235.00 808.00,230.00 808.00,240.00" fill="#5b677a"/><rect x="821.00" y="160.00" width="172.00" height="150.00" rx="14" fill="#f7f9fc" stroke="#1b7f5d"/><rect x="821.00" y="160.00" width="172.00" height="11.00" rx="14" fill="#1b7f5d" stroke="none"/><text x="907.00" y="213.00" class="box-title" text-anchor="middle">Digital twin</text><text x="907.00" y="246.00" class="box-sub" text-anchor="middle"><tspan x="907.00" dy="0.00">Erlang-A checks</tspan><tspan x="907.00" dy="16.00">SimPy replay</tspan></text><line x1="997.00" y1="235.00" x2="1011.00" y2="235.00" stroke="#5b677a" stroke-width="2.2"/><polygon points="1011.00,235.00 1002.00,230.00 1002.00,240.00" fill="#5b677a"/><rect x="1015.00" y="160.00" width="172.00" height="150.00" rx="14" fill="#f7f9fc" stroke="#bd3d4d"/><rect x="1015.00" y="160.00" width="172.00" height="11.00" rx="14" fill="#bd3d4d" stroke="none"/><text x="1101.00" y="213.00" class="box-title" text-anchor="middle">Release gate</text><text x="1101.00" y="246.00" class="box-sub" text-anchor="middle"><tspan x="1101.00" dy="0.00">PASS</tspan><tspan x="1101.00" dy="16.00">PASS_WITH_RECOURSE</tspan><tspan x="1101.00" dy="16.00">ITERATE</tspa